name: Test and release BeeBright Local
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['update-manifest.json']
permissions:
  contents: read
concurrency:
  group: local-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.15'
      - run: npm ci --prefix ui-source
      - run: node --test ui-source/src/*.test.js
      - run: node tools/build-release.mjs
      - run: python -m unittest discover -v
      - name: Verify Windows update behavior
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/test-local-update.ps1
      - name: Verify native desktop games
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -m pip install -r requirements.txt
          $env:BEEBRIGHT_DATA_DIR = Join-Path $env:RUNNER_TEMP 'bee-ui-data'
          $env:BEEBRIGHT_TEST_GAME_MENU = 'test'
          python tools/test_local_ui.py
          if ($LASTEXITCODE) { throw 'Native game menu failed.' }
  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix ui-source
      - run: node tools/build-release.mjs
      - name: Publish local package and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="desktop-${GITHUB_SHA:0:12}"
          TITLE=$(python3 -c 'import json; print("BeeBright Local " + json.load(open("release.json"))["version"])')
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" dist/beebright-local-source.zip dist/update-manifest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes-file CHANGELOG.md --draft
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
          # Legacy launchers can still discover the package through the raw main manifest.
          # The new updater uses the manifest attached to the published release first.
          cp dist/update-manifest.json update-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update local release manifest for $TAG"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
